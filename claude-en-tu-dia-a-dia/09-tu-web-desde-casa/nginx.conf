# Servidor web para la carpeta web/ (EJEMPLO). Escucha SOLO dentro de la máquina: 127.0.0.1.
# Arráncalo desde ESTA carpeta:   nginx -p . -c nginx.conf
# Páralo:                         nginx -p . -c nginx.conf -s stop
# (en Windows, igual pero con nginx.exe; en Linux puede que necesites la ruta completa, p. ej. /usr/sbin/nginx)
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 64; }
http {
    types {
        text/html  html;
        text/css   css;
        image/png  png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
    }
    access_log logs/access.log;
    # Archivos temporales dentro de esta carpeta (así funciona igual en Windows, Mac y Linux)
    client_body_temp_path temp/body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;
    server {
        listen 127.0.0.1:8099;   # solo dentro de la máquina. NUNCA 0.0.0.0 ni abrir este puerto en el router
        root web;                # la carpeta web/ de aquí al lado
        index index.html;
    }
}
